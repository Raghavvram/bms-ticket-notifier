name: BMS Ticket Checker

on:
  schedule:
    # Run every 5 minutes automatically for free via GitHub Actions
    - cron: '*/5 * * * *'
  workflow_dispatch:  # Manual trigger button

jobs:
  check-tickets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run checker
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_TO_EMAIL: ${{ secrets.RESEND_TO_EMAIL }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          BMS_LOCATION: ${{ vars.BMS_LOCATION || 'chennai' }}
          BMS_MOVIE: ${{ vars.BMS_MOVIE || 'avengers-doomsday' }}
          BMS_THEATRE: ${{ vars.BMS_THEATRE || 'VR Chennai' }}
          BMS_DATE: ${{ vars.BMS_DATE || vars.BMS_DATES || '20261221' }}
          BMS_DATES: ${{ vars.BMS_DATES || vars.BMS_DATE || '20261221' }}
          BMS_LANGUAGE: ${{ vars.BMS_LANGUAGE || 'English' }}
          BMS_FORMAT: ${{ vars.BMS_FORMAT || 'PXL,MS-Infinity Vision' }}
          ALERT_BURST: ${{ vars.ALERT_BURST || '3' }}
          BMS_URL: ${{ vars.BMS_URL || 'https://in.bookmyshow.com/movies/chennai/avengers-doomsday-ms-infinity-vsn-3d/buytickets/ET00526306' }}
          BMS_TIME: ${{ vars.BMS_TIME }}
        run: uv run main.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bms_state.json
          git diff --cached --quiet || (git commit -m "chore: update bms_state.json [skip ci]" && git push)
